[build]
  publish = "."

# Weihnachtsaktion 2026: feste Adresse fuer das Aktions-PDF (steht so in den Mail-Wellen, NICHT aendern).
# Die Adresse wird an die Function aktion-aufruf im Dashboard (app.brandilla.de) durchgereicht: sie zaehlt den Aufruf
# (ohne Personenbezug, Quelle = angehaengter Parameter, z.B. ?li fuer LinkedIn) und leitet per 302 auf das PDF weiter.
# Gleiches Muster wie /k/* beim QR-Tracking. Scheitert die Zaehlung, kommt das PDF trotzdem.
# PDF austauschen: Datei unter assets/pdf/ ersetzen, die Adresse bleibt gleich.
# Zurueck auf direkte Auslieferung ohne Zaehlung: to = "/assets/pdf/Brandilla_Weihnachtsaktion_2026.pdf"
[[redirects]]
  from = "/aktion/weihnachten-2026"
  to = "https://app.brandilla.de/.netlify/functions/aktion-aufruf/weihnachten-2026"
  status = 200
  force = true

# Aktions-PDF: nicht in Suchmaschinen, kurz cachen (austauschbar)
[[headers]]
  for = "/assets/pdf/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "public, max-age=300"

# Entfernte verwaiste Seiten → 301 auf gültiges Ziel
[[redirects]]
  from = "/index-shop"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/shop-final"
  to = "/shop"
  status = 301
  force = true

# QR-Codes auf gedruckten Medien tragen brandilla.de/k/{campaign}?pos={pos}.
# track.html liegt im Dashboard (app.brandilla.de). 302 bewusst dauerhaft
# (Entscheidung 2026-09-07), damit die Ziel-Architektur umschwenkbar bleibt.
# Query-String (?pos=) haengt Netlify bei 302 automatisch an.
[[redirects]]
  from = "/k/*"
  to = "https://app.brandilla.de/k/:splat"
  status = 302

# POS-Foto-Upload analog: brandilla.de/u/{campaign}?pos={pos} -> upload.html
# im Dashboard. Gleiche Begruendung, gleicher Status.
[[redirects]]
  from = "/u/*"
  to = "https://app.brandilla.de/u/:splat"
  status = 302

